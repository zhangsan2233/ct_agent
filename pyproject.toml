[project]
name = "chestct-agent"
version = "0.1.0"
description = "ChestCT-Agent: Qwen3.6 + LangGraph Agentic RAG prototype for chest CT evidence integration."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.1",
  "httpx>=0.27.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "scikit-learn>=1.4.0",
  "joblib>=1.4.0",
  "pillow>=10.3.0",
  "nibabel>=5.2.0",
  "langgraph>=0.2.0",
  "streamlit>=1.36.0",
  "huggingface-hub>=0.24.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0"
]
ctclip = [
  "torch>=2.7,<2.8",
  "torchvision>=0.22,<0.23",
  "transformers>=4.44.0",
  "einops>=0.6.0",
  "beartype>=0.18.0",
  "ftfy>=6.2.0",
  "regex>=2024.5.15",
  "vector-quantize-pytorch==1.1.2"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
